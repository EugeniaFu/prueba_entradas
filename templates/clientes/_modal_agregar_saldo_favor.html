<div class="modal fade" id="modalAgregarSaldoFavor" tabindex="-1" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="background:#23395d;">
        <h5 class="modal-title text-white">
          <i class="bi bi-piggy-bank me-2"></i>Agregar Saldo a Favor
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Monto ($) <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" id="sf-monto" class="form-control" min="0.01" step="0.01" placeholder="0.00">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Concepto / Motivo <span class="text-danger">*</span></label>
          <input type="text" id="sf-concepto" class="form-control" placeholder="Ej. Depósito de más, convenio, etc.">
        </div>
      </div>
      <div class="modal-footer modal-footer-azul">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-circle me-1"></i>Cancelar
        </button>
        <button type="button" class="btn btn-success" id="sf-btn-guardar">
          <i class="bi bi-check2-circle me-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>
